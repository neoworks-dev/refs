<!doctype html>
<title>Sections inside single-child wrappers</title>
<style>
	body {
		margin: 0;
		font-family: sans-serif;
	}
	section {
		height: 400px;
		padding: 40px;
		box-sizing: border-box;
	}
	section:nth-child(odd) {
		background: #eef;
	}
	section:nth-child(even) {
		background: #fee;
	}
</style>
<!-- A framework mount point with layout divs, as in `#__next > div > div > div > main`. Without
     unwrapping, the whole page is one block and the three real sections are never found. -->
<div id="__next">
	<div class="layout">
		<div class="page">
			<div class="content">
				<main>
					<section>
						<h2>Hero</h2>
						<p>Ship faster.</p>
					</section>
					<section>
						<h2>Features</h2>
						<p>Everything you need.</p>
					</section>
					<section>
						<h2>Pricing</h2>
						<p>Simple plans.</p>
					</section>
				</main>
			</div>
		</div>
	</div>
</div>
