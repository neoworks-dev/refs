[project]
name = "refs-ml"
version = "0.1.0"
description = "Starts the local model servers for Refs: the VLM on llama.cpp or vLLM, and the embedder on vLLM."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Serves Qwen3-VL-Embedding-2B. The VLM runs on llama.cpp's llama-server instead.
    "vllm==0.31.0",
    "httpx>=0.27",
    "huggingface-hub>=1.0",
]

[tool.uv]
# vLLM only ships CUDA wheels for Linux, so resolving for other platforms would be wasted work.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project.scripts]
serve = "refs_ml.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refs_ml"]
