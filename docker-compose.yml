services:
  surrealdb:
    image: surrealdb/surrealdb:v3.3.0
    command: start --log info --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} rocksdb:/data/db
    user: root
    ports:
      - '127.0.0.1:${SURREAL_PORT:-8010}:8000'
    volumes:
      - surrealdb:/data
    restart: unless-stopped

volumes:
  surrealdb:
